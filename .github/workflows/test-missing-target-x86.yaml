name: Test target feature lint

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install required Rust components
        run: |
          rustup component add rustc-dev llvm-tools-preview

      - name: Run lint UI test
        env:
          TESTNAME: call_missing_target_feature
        run: cargo uitest
